# Builds the Key Compass Android app (an .apk you install on the phone) on every push to main.
# The finished app goes on the "Android app" release page:
#   https://github.com/<you>/key-compass/releases/latest  ->  KeyCompass.apk
name: Android app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write          # to publish the .apk on the release page

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_VERSION: 8.0.15

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Get JUCE ${{ env.JUCE_VERSION }}
        run: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git JUCE

      # The Projucer turns Android/KeyCompassMobile.jucer into an Android Studio project. It takes a few
      # minutes to build, so it is kept between runs.
      - name: Projucer (cached)
        id: projucer
        uses: actions/cache/restore@v4
        with:
          path: tools/Projucer
          key: projucer-${{ env.JUCE_VERSION }}-ubuntu-24.04-v1

      - name: Build the Projucer
        if: steps.projucer.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libfreetype-dev libfontconfig1-dev \
              libcurl4-openssl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libasound2-dev
          cmake -S JUCE -B build-projucer -G Ninja -DJUCE_BUILD_EXTRAS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-projucer --target Projucer
          mkdir -p tools
          cp build-projucer/extras/Projucer/Projucer_artefacts/Release/Projucer tools/

      - name: Keep the Projucer for next time
        if: steps.projucer.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tools/Projucer
          key: projucer-${{ env.JUCE_VERSION }}-ubuntu-24.04-v1

      - name: Write the Android Studio project
        run: |
          python3 Android/make_jucer.py
          xvfb-run -a tools/Projucer --resave Android/KeyCompassMobile.jucer
          echo "sdk.dir=$ANDROID_HOME" > Android/Builds/Android/local.properties
          sed -n '1,40p' Android/Builds/Android/app/src/main/AndroidManifest.xml
          # the app must say it handles font / display size changes itself, or Android closes it (see make_jucer.py)
          if ! grep -q 'fontScale' Android/Builds/Android/app/src/main/AndroidManifest.xml; then
            echo "::error::AndroidManifest.xml lost the configChanges list"; exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            17

      # The same key must sign every build, or Android refuses to install the update over the old app.
      # It lives in the ANDROID_KEYSTORE_B64 secret (Settings > Secrets and variables > Actions).
      - name: Signing key (from the secret)
        id: secretkey
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The ANDROID_KEYSTORE_B64 secret is missing - using a temporary signing key kept in the build cache."
          fi

      - name: Temporary signing key (cached)
        if: steps.secretkey.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: temporary-signing-key-v1

      - name: Make a temporary signing key
        if: steps.secretkey.outputs.found != 'true'
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
                    -keypass android -keyalg RSA -keysize 2048 -validity 20000 -storetype JKS -dname "CN=Key Compass (temporary)"
          fi

      - name: Build the app
        working-directory: Android/Builds/Android
        run: |
          set -o pipefail
          chmod +x gradlew
          JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew --no-daemon --stacktrace --console=plain \
              -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64 \
              assembleRelease_Release 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          find app/build/outputs -name "*.apk" -print

      # When the build fails: the errors as annotations on the run, and the whole log on the ci-logs branch
      - name: Report the errors
        if: failure()
        run: |
          touch build.log
          python3 - <<'PY'
          import re
          log = open('build.log', errors='replace').read().splitlines()
          hits = [i for i, l in enumerate(log) if re.search(r'error:|error G[A-Z]|FAILED|What went wrong|undefined reference|Exception:', l)]
          shown, out = set(), []
          for i in hits:
              for j in range(max(0, i - 2), min(len(log), i + 4)):
                  if j not in shown:
                      shown.add(j); out.append(log[j])
          def emit(title, text):
              text = text[-6000:].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title={title}::{text}')
          for n in range(0, min(len(out), 400), 60):
              emit(f'build errors {n // 60 + 1}', '\n'.join(out[n:n + 60]))
          emit('end of the log', '\n'.join(log[-80:]))
          PY
          git config user.name "Android build"
          git config user.email "actions@users.noreply.github.com"
          cp build.log /tmp/build.log
          git checkout --orphan ci-logs-tmp
          git rm -rfq --cached .
          mkdir -p ci-logs && cp /tmp/build.log ci-logs/build.log
          git add -f ci-logs/build.log
          git commit -qm "Android build log for ${GITHUB_SHA::7}"
          git push -qf origin HEAD:refs/heads/ci-logs

      - name: Collect the .apk
        id: apk
        run: |
          apk=$(find Android/Builds/Android/app/build/outputs/apk -name "*.apk" | head -n 1)
          version=$(grep -o 'KC_VERSION_STRING "[^"]*"' Source/Version.h | cut -d'"' -f2)
          mkdir -p dist
          cp "$apk" dist/KeyCompass.apk
          ls -la dist
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: KeyCompass-apk
          path: dist/KeyCompass.apk
          retention-days: 30

      - name: Publish on the release page
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          tag="android-latest"
          notes="Key Compass ${VERSION} for Android phones and tablets (Android 8 or newer).
          Built $(date -u '+%Y-%m-%d %H:%M UTC') from ${GITHUB_SHA::7}.

          To install: open this page on your phone, tap KeyCompass.apk, then Open. The first time, Android asks you to
          allow installs from your browser - allow it, then tap Install."
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title "Key Compass ${VERSION} for Android" --notes "$notes" --latest
          else
            gh release create "$tag" --title "Key Compass ${VERSION} for Android" --notes "$notes" --latest
          fi
          gh release upload "$tag" dist/KeyCompass.apk --clobber

  # Installs the new app on an Android emulator, opens it, taps through the tabs and keeps screenshots and
  # the system log (on the ci-logs branch), so a crash shows up here before it reaches a phone.
  emulator-test:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: KeyCompass-apk

      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on a Pixel-sized emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -noaudio
          script: bash Scripts/android-smoke-test.sh KeyCompass.apk smoke

      - name: Keep the screenshots and the log
        if: always()
        run: |
          mkdir -p /tmp/smoke && cp -r smoke/. /tmp/smoke/ 2>/dev/null || true
          git config user.name "Android build"
          git config user.email "actions@users.noreply.github.com"
          git fetch -q origin ci-logs || true
          git checkout -q --orphan ci-smoke
          git rm -rfq --cached .
          mkdir -p ci-smoke && cp -r /tmp/smoke/. ci-smoke/ 2>/dev/null || true
          git add -f ci-smoke
          git commit -qm "Emulator test for ${GITHUB_SHA::7}" || true
          git push -qf origin HEAD:refs/heads/ci-smoke

      - name: Report anything that closed the app
        if: always()
        run: |
          cat /tmp/smoke/result.txt 2>/dev/null || true
          if grep -q "NOT RUNNING" /tmp/smoke/result.txt 2>/dev/null; then
            grep "NOT RUNNING" /tmp/smoke/result.txt | while read -r line; do echo "::warning::$line"; done
            grep -E "wm_finish_activity|am_proc_died|wm_relaunch" /tmp/smoke/events.txt 2>/dev/null | head -8 | while read -r line; do echo "::warning::$line"; done
          fi
